<!doctype html>
<html lang="en">

    <link rel="icon" type="image/svg+xml" href="/favicon-ss.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const theme = localStorage.getItem('portfolio-theme')
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400..700&family=Public+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Sanskar Solapure’s portfolio: Smart Campus, a campus maintenance app built with React, Vite, Supabase, PostgreSQL, and Vercel."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#F4EFE6" />
    <meta property="og:title" content="Sanskar Solapure | Portfolio" />
    <meta
      property="og:description"
      content="Sanskar Solapure’s portfolio: Smart Campus, a campus maintenance app built with React, Vite, Supabase, PostgreSQL, and Vercel."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
